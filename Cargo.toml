[package]
name = "pantau-app"
version = "1.2.1"
edition = "2024"

[dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
libc = "0.2"
mach2 = "0.4"
core-foundation-sys = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ratatui = "0.29"
crossterm = "0.28"
rayon = "1.10"
jwalk = "0.8"
trash = "5.2"
walkdir = "2.5"
regex = "1.10"
chrono = "0.4"
